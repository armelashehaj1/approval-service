spring:
  application.name: approvals-service
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5433}/${DATABASE_NAME:approvals}
    username: ${DATABASE_USERNAME:approvals}
    password: ${DATABASE_PASSWORD:approvals}
  jpa:
    hibernate.ddl-auto: update
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: approvals
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
approvals:
  timers:
    poll-interval: PT5S
    batch-size: 100
    lock-duration: PT2M
  channels:
    default-channels: [IN_APP, EMAIL]
    token-ttl: PT72H
    public-base-url: ${APPROVALS_PUBLIC_URL:http://localhost:8080}
  storage:
    documents-folder: approvals-documents
    quarantine-folder: approvals-quarantine
    evidence-folder: approvals-evidence
  evidence:
    max-size-bytes: 20971520
    allowed-types: [application/pdf]
    lotl-url: https://ec.europa.eu/tools/lotl/eu-lotl.xml
    tsl-cache-dir: ${TSL_CACHE_DIR:/var/cache/approvals/tsl}
    stuck-after: PT15M

logging.level.net.threeisolutions.approvals: DEBUG
