spring:
  application.name: approvals-service
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5433}/${DATABASE_NAME:approval}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:password}
  jpa:
    hibernate.ddl-auto: update
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: approvals
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
  jackson:
    visibility.creator: none
  security.oauth2.resourceserver.jwt:
    # Blank issuer: no JwtDecoder is created and only API keys authenticate.
    issuer-uri: ${approvals.security.oauth.issuer-uri}
    audiences: ${approvals.security.oauth.audiences}

approvals:
  security:
    # One IdP per deployment, chosen in the env file
    oauth:
      issuer-uri: ${OAUTH_ISSUER_URI:}
      audiences: ${OAUTH_AUDIENCES:}
      permission-claims: ${OAUTH_PERMISSION_CLAIMS:scope}
      principal-claim: ${OAUTH_PRINCIPAL_CLAIM:sub}
      email-claim: ${OAUTH_EMAIL_CLAIM:email}
      name-claim: ${OAUTH_NAME_CLAIM:name}
      mfa-claim: ${OAUTH_MFA_CLAIM:}
      mfa-value: ${OAUTH_MFA_VALUE:mfa}

logging.level.net.threeisolutions.approvals: DEBUG
