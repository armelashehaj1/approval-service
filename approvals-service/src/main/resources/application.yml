spring:
  application.name: approvals-service
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5433}/${DATABASE_NAME:approvals}
    username: ${DATABASE_USERNAME:approvals}
    password: ${DATABASE_PASSWORD:approvals}
  jpa:
    hibernate.ddl-auto: update
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: approvals
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
approvals:
  timers:
    poll-interval: PT5S
    batch-size: 100
    lock-duration: PT2M
  channels:
    default-channels: [IN_APP, EMAIL]
    token-ttl: PT72H
    public-base-url: ${APPROVALS_PUBLIC_URL:http://localhost:8080}

logging.level.net.threeisolutions.approvals: DEBUG
